name: CLI release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this package version (otherwise validate and build only)
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Decide whether this is a version release
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          REQUEST_PUBLISH: ${{ inputs.publish }}
        run: node scripts/release.mjs plan
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test, package, and verify the standalone runtime
        run: node scripts/release.mjs prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: recurrence-cli-${{ steps.plan.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 7
      - name: Publish verified assets and smoke test the installer
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs publish
